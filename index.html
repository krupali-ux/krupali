
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Prediction System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Prediction System</h1>
        <p>Analyze academic performance and predict exam results</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Student Information</h2>

            <form id="predictionForm">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                       placeholder="Enter student name" required>

                <label for="attendance">Attendance (%)</label>
                <input type="number" id="attendance"
                       min="0" max="100" step="any"
                       placeholder="e.g. 85" required>

                <label for="studyHours">Daily Study Hours</label>
                <input type="number" id="studyHours"
                       min="0" max="24" step="any"
                       placeholder="e.g. 4" required>

                <label for="previousMarks">Previous Exam Marks (%)</label>
                <input type="number" id="previousMarks"
                       min="0" max="100" step="any"
                       placeholder="e.g. 75" required>

                <label for="assignments">Assignment Completion (%)</label>
                <input type="number" id="assignments"
                       min="0" max="100" step="any"
                       placeholder="e.g. 90" required>

                <button type="submit">Predict Performance</button>
                <button type="reset" class="reset">
                    Reset Form
                </button>
            </form>
        </section>

        <section class="card result" id="result"
                 aria-live="polite" hidden>
            <h2>Prediction Result</h2>
            <p id="studentName"></p>
            <p class="score" id="predictedMarks">--%</p>
            <p id="category"></p>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <p id="passStatus"></p>
            <p class="note">
                This is an educational estimate, not a guaranteed result.
            </p>
        </section>
    </main>

    <footer>
        <p>Student Prediction System | Mini Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
